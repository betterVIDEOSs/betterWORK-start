<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>betterAPP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="betterAPP">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#07090D">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #07090D; overflow: hidden; }
  #bw-app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #bw-hint { display: none; color: #b1b4b8; font: 16px/1.5 -apple-system, Arial, sans-serif; text-align: center; padding: 40vh 24px 0; }
</style>
</head>
<body>
<div id="bw-hint">Bitte den persönlichen betterAPP-Link öffnen (mit <code>?key=…</code>).</div>
<script>
  // Die eigentliche App läuft bei Google Apps Script. Diese Seite liefert nur Name und Symbol
  // für den Home-Bildschirm und zeigt die App bildschirmfüllend an.
  var APP = 'https://script.google.com/macros/s/AKfycbxNCuIyDGL4_tELTUxt8hj-qoWPiUpRiFZMYOWUFftXB8Jh6ptZUAaK6pKA3JlJZA6K/exec';
  var key = new URLSearchParams(location.search).get('key') || '';
  try { if (key) localStorage.setItem('bwKey', key); else key = localStorage.getItem('bwKey') || ''; } catch (e) {}
  if (key) {
    var f = document.createElement('iframe');
    f.id = 'bw-app';
    f.src = APP + '?key=' + encodeURIComponent(key);
    f.allow = 'camera; microphone; clipboard-read; clipboard-write; geolocation';
    document.body.appendChild(f);
  } else {
    document.getElementById('bw-hint').style.display = 'block';
  }
</script>
</body>
</html>
